name: Build and Push cBioPortal LibreChat Image

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. v0.8.3-rc1-custom-v6). Defaults to branch name.'
        type: string
        required: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Image tagging convention:
      #   - Manual dispatch: uses the user-provided tag (e.g. "v0.8.3-rc1-custom-v8")
      #   - Automatic (push): uses the branch name with "/" replaced by "-"
      #     e.g. branch "v0.8.3-rc1-custom-v7" -> tag "v0.8.3-rc1-custom-v7"
      # Convention: <upstream-version>-custom-v<N> where N is incremented for each cBioPortal-specific release.
      # The same tag is deployed to BOTH AWS accounts (203403084713 and 666628074417)
      # via the update_k8s_deployment job, which updates both values.yaml files.
      - name: Set image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # Use branch name, replacing / with -
            BRANCH="${GITHUB_REF_NAME//\//-}"
            echo "tag=${BRANCH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: cbioportal/librechat:${{ steps.tag.outputs.tag }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update_k8s_deployment:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      K8S_REPO: 'knowledgesystems/knowledgesystems-k8s-deployment'
      IMAGE_REPO: 'cbioportal/librechat'
      DEPLOYMENT_FILES: >-
        argocd/aws/203403084713/clusters/cbioportal-prod/apps/cbioagent/values.yaml
        argocd/aws/666628074417/clusters/cbioportal-prod/apps/cbioagent/values.yaml
      ARGOCD_CLI_VER: '2.13.3'
      ARGOCD_SERVER: 'argocd.cbioportal.org'
      ARGOCD_APP: 'cbioagent'
    steps:
      - name: Checkout K8s Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.K8S_REPO }}
          token: ${{ secrets.K8S_REPO_TOKEN }}

      - name: Update image tag in values files
        run: |
          IMAGE_TAG=${{ needs.build.outputs.image_tag }}
          for FILE in $DEPLOYMENT_FILES; do
            # Only update the image.tag field (indented under 'image:'), not other tag fields
            sed -i '/^image:/,/^[^ ]/ s|^\(  tag:\).*|\1 "'"${IMAGE_TAG}"'"|' $FILE
          done

      - name: Commit and push changes
        run: |
          git config --global user.email "cBioPortal-Action@github.com"
          git config --global user.name "LibreChat Github Action"
          if ! git diff --quiet; then
            git add -A
            git commit -m "Update LibreChat image tag to ${{ needs.build.outputs.image_tag }}"
          else
            echo "No changes to commit."
          fi

      - name: Push changes to K8s repo
        uses: ad-m/github-push-action@master
        with:
          github_token: '${{ secrets.K8S_REPO_TOKEN }}'
          repository: ${{ env.K8S_REPO }}
          branch: master

      - name: Setup ArgoCD
        uses: clowdhaus/argo-cd-action/@main
        with:
          version: ${{ env.ARGOCD_CLI_VER }}
          command: login ${{ env.ARGOCD_SERVER }}
          options: --username ${{ secrets.ARGOCD_2034_USERNAME }} --password ${{ secrets.ARGOCD_2034_PASSWORD }}

      - name: Sync ArgoCD deployment
        uses: clowdhaus/argo-cd-action/@main
        with:
          version: ${{ env.ARGOCD_CLI_VER }}
          command: app sync ${{ env.ARGOCD_APP }}
          options: --resource apps:Deployment:default/librechat
